<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 820" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#080b10"/>
      <stop offset="100%" stop-color="#030406"/>
    </linearGradient>
    <radialGradient id="heatAnomaly" cx="45%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#001a40"/>
      <stop offset="20%" stop-color="#00aaff"/>
      <stop offset="40%" stop-color="#00ff66"/>
      <stop offset="65%" stop-color="#ffcc00"/>
      <stop offset="85%" stop-color="#ff1a1a"/>
      <stop offset="100%" stop-color="#e60000"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Phone Frame -->
  <rect width="400" height="820" rx="36" fill="url(#bgGrad)" stroke="#222b38" stroke-width="4"/>
  <rect x="12" y="12" width="376" height="796" rx="28" fill="#080a0f"/>

  <!-- Status Bar -->
  <text x="28" y="38" fill="#8899ac" font-family="sans-serif" font-size="11">۱۳:۲۱</text>
  <text x="325" y="38" fill="#d6a63a" font-family="sans-serif" font-size="11">۹٪ 🔋</text>

  <!-- Top Title Bar -->
  <rect x="20" y="52" width="360" height="42" rx="10" fill="#111823" stroke="#d6a63a" stroke-opacity="0.3"/>
  <text x="365" y="77" fill="#ffd700" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="end">حفره و اتاقک زیرزمینی (Deep Chamber)</text>
  <rect x="30" y="60" width="80" height="26" rx="6" fill="#d6a63a" fill-opacity="0.2" stroke="#d6a63a"/>
  <text x="70" y="77" fill="#ffd700" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">12×10 سه بعدی</text>

  <!-- Section Badge -->
  <rect x="20" y="102" width="360" height="32" rx="8" fill="#0d1520"/>
  <text x="365" y="123" fill="#00f0ff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="end">🗺️ نمای ۲ بعدی فیلترشده (OKM Realtime Plan)</text>

  <!-- 2D Heatmap Grid Display -->
  <rect x="20" y="142" width="360" height="300" rx="12" fill="url(#heatAnomaly)" stroke="#1f2a3a"/>
  
  <!-- Heatmap Grid Lines Overlay -->
  <g stroke="#ffffff" stroke-opacity="0.12" stroke-width="1">
    <line x1="20" y1="172" x2="380" y2="172"/>
    <line x1="20" y1="202" x2="380" y2="202"/>
    <line x1="20" y1="232" x2="380" y2="232"/>
    <line x1="20" y1="262" x2="380" y2="262"/>
    <line x1="20" y1="292" x2="380" y2="292"/>
    <line x1="20" y1="322" x2="380" y2="322"/>
    <line x1="20" y1="352" x2="380" y2="352"/>
    <line x1="20" y1="382" x2="380" y2="382"/>
    <line x1="20" y1="412" x2="380" y2="412"/>

    <line x1="56" y1="142" x2="56" y2="442"/>
    <line x1="92" y1="142" x2="92" y2="442"/>
    <line x1="128" y1="142" x2="128" y2="442"/>
    <line x1="164" y1="142" x2="164" y2="442"/>
    <line x1="200" y1="142" x2="200" y2="442"/>
    <line x1="236" y1="142" x2="236" y2="442"/>
    <line x1="272" y1="142" x2="272" y2="442"/>
    <line x1="308" y1="142" x2="308" y2="442"/>
    <line x1="344" y1="142" x2="344" y2="442"/>
  </g>

  <!-- Crosshair Targets on Map -->
  <g stroke="#ffd700" stroke-width="1.5" fill="none" filter="url(#glow)">
    <circle cx="164" cy="307" r="14" stroke-dasharray="3 3"/>
    <line x1="144" y1="307" x2="184" y2="307"/>
    <line x1="164" y1="287" x2="164" y2="327"/>

    <circle cx="272" cy="232" r="12" stroke="#00f0ff"/>
    <line x1="256" y1="232" x2="288" y2="232" stroke="#00f0ff"/>
    <line x1="272" y1="216" x2="272" y2="248" stroke="#00f0ff"/>
  </g>

  <!-- Signal Readings overlay badge -->
  <rect x="30" y="380" width="100" height="52" rx="6" fill="#000000" fill-opacity="0.7"/>
  <text x="40" y="400" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">Max: ۹۳٫۵۶</text>
  <text x="40" y="420" fill="#aaa" font-family="sans-serif" font-size="10">Grid: 10x12</text>

  <!-- Smart Targets Card Header -->
  <rect x="20" y="454" width="360" height="230" rx="16" fill="#0e141f" stroke="#1f2c3f"/>
  
  <rect x="32" y="468" width="22" height="22" rx="11" fill="#ffd700"/>
  <text x="365" y="484" fill="#ffd700" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="end">🎯 نشانگرهای هدف هوشمند (Smart Targets)</text>
  <text x="365" y="506" fill="#8899ac" font-family="sans-serif" font-size="10" text-anchor="end">آنومالی‌های فرکانسی فلزی با احتمال بالا کشف شدند:</text>

  <!-- Target 1 Item (Gold) -->
  <rect x="32" y="520" width="336" height="66" rx="12" fill="#141d2b" stroke="#ffd700" stroke-opacity="0.4"/>
  <circle cx="340" cy="553" r="14" fill="#ffd700"/>
  <text x="340" y="558" fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">۱</text>

  <text x="315" y="546" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="end">هدف ۴: طلا ✨</text>
  <text x="315" y="568" fill="#8899ac" font-family="sans-serif" font-size="10" text-anchor="end">موقعیت: X: 8, Y: 7</text>

  <text x="50" y="546" fill="#00f0ff" font-family="sans-serif" font-size="12" font-weight="bold">عمق: ۰٫۵۰ متر</text>
  <text x="50" y="568" fill="#8899ac" font-family="sans-serif" font-size="10">سیگنال: ۷۴۰ Hz</text>

  <!-- Target 2 Item (Precious Metal) -->
  <rect x="32" y="596" width="336" height="66" rx="12" fill="#141d2b" stroke="#00f0ff" stroke-opacity="0.3"/>
  <circle cx="340" cy="629" r="14" fill="#00f0ff"/>
  <text x="340" y="634" fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">۲</text>

  <text x="315" y="622" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="end">هدف ۳: فلز ارزشمند 💎</text>
  <text x="315" y="644" fill="#8899ac" font-family="sans-serif" font-size="10" text-anchor="end">موقعیت: X: 8, Y: 1</text>

  <text x="50" y="622" fill="#00f0ff" font-family="sans-serif" font-size="12" font-weight="bold">عمق: ۶٫۰۷ متر</text>
  <text x="50" y="644" fill="#8899ac" font-family="sans-serif" font-size="10">سیگنال: ۶۲۰ Hz</text>

  <!-- Quick FAB -->
  <circle cx="55" cy="650" r="22" fill="#d6a63a" filter="url(#glow)"/>
  <text x="55" y="656" fill="#000" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">+</text>

  <!-- Navigation Tab Bar -->
  <rect x="20" y="696" width="360" height="54" rx="16" fill="#0e131d" stroke="#1f2a3a"/>
  
  <g font-family="sans-serif" font-size="9" text-anchor="middle">
    <text x="52" y="726" fill="#667788">اسکن زمین</text>
    <circle cx="112" cy="716" r="14" fill="#ffd700" fill-opacity="0.2"/>
    <text x="112" y="738" fill="#ffd700" font-weight="bold">سه بعدی</text>
    <text x="172" y="726" fill="#667788">زنده</text>
    <text x="232" y="726" fill="#667788">تاریخچه</text>
    <text x="292" y="726" fill="#667788">هوش مصنوعی</text>
    <text x="348" y="726" fill="#667788">تنظیمات</text>
  </g>
</svg>
