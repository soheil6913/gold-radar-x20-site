<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 820" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#080b10"/>
      <stop offset="100%" stop-color="#030406"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Phone Frame -->
  <rect width="400" height="820" rx="36" fill="url(#bgGrad)" stroke="#222b38" stroke-width="4"/>
  <rect x="12" y="12" width="376" height="796" rx="28" fill="#080a0f"/>

  <!-- Status Bar -->
  <text x="28" y="38" fill="#8899ac" font-family="sans-serif" font-size="11">۱۳:۱۶</text>
  <text x="325" y="38" fill="#d6a63a" font-family="sans-serif" font-size="11">۱۱٪ 🔋</text>

  <!-- Calibration Banner Header -->
  <rect x="20" y="52" width="360" height="80" rx="14" fill="#101826" stroke="#ffd700" stroke-opacity="0.4"/>
  <circle cx="340" cy="92" r="22" fill="#ffd700" fill-opacity="0.2" stroke="#ffd700"/>
  <text x="340" y="98" fill="#ffd700" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">⚙️</text>

  <text x="305" y="80" fill="#ffd700" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="end">راهنمای ۵ مرحله‌ای کالیبراسیون رادار</text>
  <text x="305" y="102" fill="#8899ac" font-family="sans-serif" font-size="10" text-anchor="end">کالیبراسیون نقطه‌صفر خاک، حذف نویز و تنظیم قطب‌نما</text>

  <!-- Setup Category Tabs -->
  <rect x="20" y="142" width="170" height="38" rx="10" fill="#121a24"/>
  <text x="105" y="165" fill="#8899ac" font-family="sans-serif" font-size="11" text-anchor="middle">📡 سخت‌افزار و سنسور</text>

  <rect x="200" y="142" width="180" height="38" rx="10" fill="#ffd700" fill-opacity="0.15" stroke="#ffd700"/>
  <text x="290" y="165" fill="#ffd700" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">▦ ابعاد و زمینه اسکن</text>

  <!-- Grid Dimension Controls -->
  <rect x="20" y="192" width="360" height="110" rx="16" fill="#0d1420" stroke="#1c2838"/>

  <!-- Col 1: Length (Rows) -->
  <text x="105" y="218" fill="#ffd700" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">تعداد خطوط اسکن (طول)</text>
  <text x="105" y="234" fill="#8899ac" font-family="sans-serif" font-size="9" text-anchor="middle">Grid Length (Rows)</text>

  <rect x="32" y="244" width="146" height="42" rx="8" fill="#141e2e"/>
  <text x="50" y="270" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold">+</text>
  <text x="105" y="271" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">10</text>
  <text x="160" y="270" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold">−</text>

  <!-- Col 2: Width (Cols) -->
  <text x="285" y="218" fill="#ffd700" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">تعداد پالس در خط (عرض)</text>
  <text x="285" y="234" fill="#8899ac" font-family="sans-serif" font-size="9" text-anchor="middle">Grid Width (Cols)</text>

  <rect x="212" y="244" width="146" height="42" rx="8" fill="#141e2e"/>
  <text x="230" y="270" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold">+</text>
  <text x="285" y="271" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">8</text>
  <text x="340" y="270" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold">−</text>

  <!-- Soil Selection Section -->
  <text x="365" y="328" fill="#ffd700" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="end">نوع خاک هدف (Soil Type)</text>
  <text x="365" y="346" fill="#8899ac" font-family="sans-serif" font-size="10" text-anchor="end">بر روی سرعت امواج عمق‌سنج اثرگذار است</text>

  <!-- Soil Chips Grid -->
  <rect x="200" y="358" width="180" height="36" rx="8" fill="#ffd700" fill-opacity="0.2" stroke="#ffd700"/>
  <text x="290" y="380" fill="#ffd700" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">خاک کشاورزی (Soil)</text>

  <rect x="20" y="358" width="170" height="36" rx="8" fill="#00f0ff" fill-opacity="0.1" stroke="#00f0ff"/>
  <text x="105" y="380" fill="#00f0ff" font-family="sans-serif" font-size="11" text-anchor="middle">خاک معدنی (Mineral)</text>

  <rect x="200" y="404" width="180" height="36" rx="8" fill="#141e2e" stroke="#1f2d40"/>
  <text x="290" y="426" fill="#00f0ff" font-family="sans-serif" font-size="11" text-anchor="middle">سنگ و صخره (Hard Rock)</text>

  <rect x="20" y="404" width="170" height="36" rx="8" fill="#141e2e" stroke="#1f2d40"/>
  <text x="105" y="426" fill="#00f0ff" font-family="sans-serif" font-size="11" text-anchor="middle">ماسه خیس (Wet Sand)</text>

  <!-- Scan Movement Pattern Section -->
  <text x="365" y="470" fill="#ffd700" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="end">طرح حرکت اسکن (Scan Pattern)</text>

  <g transform="translate(20, 482)">
    <rect x="0" y="0" width="170" height="54" rx="10" fill="#121b28" stroke="#1c2a3d"/>
    <text x="85" y="32" fill="#00f0ff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">🔄 زیگزاگ (Zig-Zag)</text>

    <rect x="190" y="0" width="170" height="54" rx="10" fill="#00f0ff" fill-opacity="0.15" stroke="#00f0ff"/>
    <text x="275" y="32" fill="#00f0ff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">☰ موازی (Parallel)</text>
  </g>

  <!-- Quick FAB -->
  <circle cx="55" cy="650" r="22" fill="#d6a63a" filter="url(#glow)"/>
  <text x="55" y="656" fill="#000" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">+</text>

  <!-- Navigation Tab Bar -->
  <rect x="20" y="696" width="360" height="54" rx="16" fill="#0e131d" stroke="#1f2a3a"/>
  
  <g font-family="sans-serif" font-size="9" text-anchor="middle">
    <circle cx="52" cy="716" r="14" fill="#ffd700" fill-opacity="0.2"/>
    <text x="52" y="738" fill="#ffd700" font-weight="bold">اسکن زمین</text>
    <text x="112" y="726" fill="#667788">سه بعدی</text>
    <text x="172" y="726" fill="#667788">زنده</text>
    <text x="232" y="726" fill="#667788">تاریخچه</text>
    <text x="292" y="726" fill="#667788">هوش مصنوعی</text>
    <text x="348" y="726" fill="#667788">تنظیمات</text>
  </g>
</svg>
