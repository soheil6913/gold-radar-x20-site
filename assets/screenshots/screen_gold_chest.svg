<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 820" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#080b10"/>
      <stop offset="100%" stop-color="#030406"/>
    </linearGradient>
    <radialGradient id="goldChestGrid" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff0000"/>
      <stop offset="25%" stop-color="#ff9900"/>
      <stop offset="60%" stop-color="#00e64d"/>
      <stop offset="100%" stop-color="#006622"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Phone Frame -->
  <rect width="400" height="820" rx="36" fill="url(#bgGrad)" stroke="#222b38" stroke-width="4"/>
  <rect x="12" y="12" width="376" height="796" rx="28" fill="#080a0f"/>

  <!-- Status Bar -->
  <text x="28" y="38" fill="#8899ac" font-family="sans-serif" font-size="11">۱۳:۱۲</text>
  <text x="325" y="38" fill="#d6a63a" font-family="sans-serif" font-size="11">۱۲٪ 🔋</text>

  <!-- Top Title Bar -->
  <rect x="20" y="52" width="360" height="42" rx="10" fill="#111823" stroke="#ffd700" stroke-opacity="0.4"/>
  <text x="365" y="77" fill="#ffd700" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="end">صندوقچه طلای مدفون (Gold Chest)</text>

  <!-- Mode Filter Pills Header -->
  <rect x="20" y="104" width="360" height="38" rx="8" fill="#0a1018"/>
  <g font-family="sans-serif" font-size="10" font-weight="bold">
    <rect x="30" y="109" width="100" height="28" rx="6" fill="#00d2ff" fill-opacity="0.2" stroke="#00d2ff"/>
    <text x="80" y="127" fill="#00f0ff" text-anchor="middle">عمق 3D</text>

    <rect x="140" y="109" width="100" height="28" rx="6" fill="#ffaa00" fill-opacity="0.2" stroke="#ffaa00"/>
    <text x="190" y="127" fill="#ffaa00" text-anchor="middle">🔥 حرارتی</text>

    <rect x="250" y="109" width="120" height="28" rx="6" fill="#182433"/>
    <text x="310" y="127" fill="#8899ac" text-anchor="middle">شبکه 12×10 | معدنی</text>
  </g>

  <!-- 3D Surface Gold Chest Mesh -->
  <rect x="20" y="152" width="360" height="480" rx="16" fill="#030508" stroke="#16202c"/>

  <!-- Perspective 3D Grid Plane -->
  <g transform="translate(200, 390) rotate(15) scale(1, 0.65)">
    <!-- Outer Box Envelope -->
    <rect x="-140" y="-140" width="280" height="280" fill="url(#goldChestGrid)" opacity="0.85" stroke="#00f0ff" stroke-width="1.5"/>

    <!-- Mesh Cell Lines -->
    <g stroke="#000000" stroke-opacity="0.3" stroke-width="1">
      <line x1="-140" y1="-112" x2="140" y2="-112"/>
      <line x1="-140" y1="-84" x2="140" y2="-84"/>
      <line x1="-140" y1="-56" x2="140" y2="-56"/>
      <line x1="-140" y1="-28" x2="140" y2="-28"/>
      <line x1="-140" y1="0" x2="140" y2="0"/>
      <line x1="-140" y1="28" x2="140" y2="28"/>
      <line x1="-140" y1="56" x2="140" y2="56"/>
      <line x1="-140" y1="84" x2="140" y2="84"/>
      <line x1="-140" y1="112" x2="140" y2="112"/>

      <line x1="-112" y1="-140" x2="-112" y2="140"/>
      <line x1="-84" y1="-140" x2="-84" y2="140"/>
      <line x1="-56" y1="-140" x2="-56" y2="140"/>
      <line x1="-28" y1="-140" x2="-28" y2="140"/>
      <line x1="0" y1="-140" x2="0" y2="140"/>
      <line x1="28" y1="-140" x2="28" y2="140"/>
      <line x1="56" y1="-140" x2="56" y2="140"/>
      <line x1="84" y1="-140" x2="84" y2="140"/>
      <line x1="112" y1="-140" x2="112" y2="140"/>
    </g>

    <!-- Central Gold Chest Anomaly Peak Pins -->
    <circle cx="0" cy="0" r="18" fill="#ff0000" stroke="#ffd700" stroke-width="3"/>
    <circle cx="-14" cy="14" r="8" fill="#ffd700"/>
    <circle cx="14" cy="-14" r="8" fill="#ffd700"/>
  </g>

  <!-- Quick FAB -->
  <circle cx="55" cy="650" r="22" fill="#d6a63a" filter="url(#glow)"/>
  <text x="55" y="656" fill="#000" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">+</text>

  <!-- Navigation Buttons Bar -->
  <rect x="20" y="642" width="360" height="42" rx="10" fill="#0d1522" stroke="#1f2c3d"/>
  <g font-family="sans-serif" font-size="10" text-anchor="middle">
    <text x="65" y="667" fill="#ffffff">⚙️ تنظیمات</text>
    <text x="155" y="667" fill="#ffffff">🖊️ پروفایل</text>
    <text x="245" y="667" fill="#ffffff">⚡ حسگرها</text>
    <text x="330" y="667" fill="#ffd700" font-weight="bold">🤖 هوش</text>
  </g>

  <!-- Navigation Tab Bar -->
  <rect x="20" y="696" width="360" height="54" rx="16" fill="#0e131d" stroke="#1f2a3a"/>
  
  <g font-family="sans-serif" font-size="9" text-anchor="middle">
    <text x="52" y="726" fill="#667788">اسکن زمین</text>
    <circle cx="112" cy="716" r="14" fill="#ffd700" fill-opacity="0.2"/>
    <text x="112" y="738" fill="#ffd700" font-weight="bold">سه بعدی</text>
    <text x="172" y="726" fill="#667788">زنده</text>
    <text x="232" y="726" fill="#667788">تاریخچه</text>
    <text x="292" y="726" fill="#667788">هوش مصنوعی</text>
    <text x="348" y="726" fill="#667788">تنظیمات</text>
  </g>
</svg>
